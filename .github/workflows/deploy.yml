name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the job itself only reads the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Format, typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Release blocker per the PRD: the service-role key must never reach the
      # browser. This runs before anything else so a leak fails fast.
      - name: Guard against a service-role key in client code
        run: ./scripts/check-no-service-key.sh

      # Each step is separate so a red run names the failure in its title
      # rather than making you open the log to find out which check broke.
      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A project site is served from /<repo>/, but a custom domain serves it
          # from the root instead — so the base path has to follow the domain or
          # every asset request 404s. Set the PAGES_DOMAIN repository variable
          # when a custom domain is configured, leave it unset otherwise.
          BASE_PATH: ${{ vars.PAGES_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          # The anon key is public by design — RLS is the security boundary —
          # but it is kept in repo secrets so it is masked in build logs and
          # can be rotated without a code change.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify the bundle carries no service-role key
        run: ./scripts/check-no-service-key.sh

      # Pages would otherwise run the output through Jekyll.
      - run: touch dist/.nojekyll

      # Ships the domain with the artifact so a deploy cannot drop it.
      - name: Pin the custom domain
        if: vars.PAGES_DOMAIN != ''
        run: echo '${{ vars.PAGES_DOMAIN }}' > dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
